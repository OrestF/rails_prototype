services:
  postgres:
    container_name: ${APP_NAME}_postgres
    image: postgres:${POSTGRES_VERSION}
    restart: always
    networks:
      - app-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Set POSTGRES_PUBLISHED_PORT when a local PostgreSQL already listens on 5432
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    env_file: stack.env
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}' ]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - development
      - all
      - cicd
      - staging

