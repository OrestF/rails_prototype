# To access data postgres writes within container from host machine
volumes:
  postgres_data: {}
  rails_storage: {}
#  elasticsearch_data: {}

# Project-scoped (<project>_app-net): a fixed global name collides between projects and CI runs on one host
networks:
  app-net: {}
