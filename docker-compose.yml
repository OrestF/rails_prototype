  rails: &rails
    container_name: ${APP_NAME}_rails
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_NAME}_rails
    env_file: stack.env
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    volumes:
      - '.:/var/www'
      # Active Storage files survive container recreation and stay out of the host's storage/
      - rails_storage:/var/www/storage
    networks:
      - app-net
    ports:
      - "${RAILS_PUBLISHED_PORT:-3000}:3000"
    #    entrypoint: ./docker-entrypoint.sh
    # For using pry
    stdin_open: true
    depends_on:
      - postgres
    # jobs waits for this: the entrypoint runs db:prepare, which creates the queue database
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -fs http://localhost:3000/up || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    tty: true
    profiles:
      - development
      - all

  rails_server:
    <<: *rails
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "${AWS_REGION}"
        awslogs-group: "${APP_NAME}-${COMPOSE_PROFILES}-rails"
        awslogs-datetime-format: '\[%b %d, %Y %H:%M:%S\]'
        tag: "{{.Name}}/{{.ID}}"
        awslogs-create-group: "true"
    depends_on: {}
    profiles:
      - production
      - preprod
      - staging

  jobs: &jobs
    <<: *rails
    image: ${APP_NAME}_rails
    container_name: ${APP_NAME}_jobs
    restart: always
    ports: []
    # Solid Queue; a project on Sidekiq runs it from the same entrypoint (see the script)
    entrypoint: ./docker-entrypoint-jobs.sh
    # On a fresh volume the queue database exists only once rails has run db:prepare
    depends_on:
      rails:
        condition: service_healthy
    healthcheck:
      disable: true
    profiles:
      - development
      - all

  jobs_server:
    <<: *jobs
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "${AWS_REGION}"
        awslogs-group: "${APP_NAME}-${COMPOSE_PROFILES}-rails"
        awslogs-datetime-format: '\[%b %d, %Y %H:%M:%S\]'
        tag: "{{.Name}}/{{.ID}}"
        awslogs-create-group: "true"
    depends_on: { }
    profiles:
      - production
      - preprod
      - staging

