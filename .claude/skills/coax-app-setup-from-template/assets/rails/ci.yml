# COAX Rails CI, modelled on doer_be_api's .github/workflows/rubocop.yml and docker_ci.yml:
#   lint   - RuboCop (+ Brakeman and bundler-audit) on the runner
#   test   - the specs inside Docker Compose, then SonarQube analysis with the coverage report
# Wiki "Setup CI/CD": tests and linters run on pull requests to dev and production.
#
# Needs in the repository (see references/rails.md, "CI"): .env.test (copied to stack.env here), a Compose "cicd"
# profile that starts Postgres, database.yml reading POSTGRES_* from ENV, docker-entrypoint.test.sh, and the
# SONAR_URL / SONAR_TOKEN secrets.
# Runners: COAX self-hosted ([self-hosted, coax]) are available to coaxsoft repositories; elsewhere use
# runs-on: ubuntu-latest (Docker and apt are available there too).
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - production

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Run rubocop
    runs-on: [self-hosted, coax]
    env:
      BUNDLE_WITHOUT: "test"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: dpkg -s libyaml-dev >/dev/null 2>&1 || sudo apt-get -o DPkg::Lock::Timeout=300 install -y libyaml-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          cache-version: 1

      - name: Run rubocop
        run: bundle exec rubocop

      # Same exclusions as the Brakeman hook in .overcommit.yml
      - name: Run brakeman
        run: bundle exec brakeman --no-pager --exit-on-warn --except MassAssignment,PermitAttributes,SendFile

      - name: Check gems for known vulnerabilities
        run: bundle exec bundler-audit check --update

  test:
    name: Run tests
    timeout-minutes: 20
    runs-on: [self-hosted, coax]
    env:
      APP_NAME: ${{ github.event.repository.name }} # for dynamic container names
      RAILS_ENV: test
      COMPOSE_PROJECT_NAME: "${{ github.event.repository.name }}_${{ github.run_id }}"
      # Build with the default docker driver: the image is written straight to the image store instead of the
      # tarball export/import path, which swallows errors
      BUILDX_BUILDER: default
      # Test-only values. r_creds reads ENV before credentials, so CI needs no credentials key
      # (doer_be_api commits config/credentials/ci.key + ci.yml.enc instead; either works)
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-test-password
      DEVISE_JWT_SECRET_KEY: ci-test-only-jwt-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Copy .env.test
        run: cp .env.test stack.env

      - name: Show disk and docker usage
        run: |
          df -h
          docker system df

      # Shared self-hosted runner: a stray "app-net" (no project prefix) can be left behind by an unrelated or
      # crashed run and blocks `up` with "incorrect label", since our network is always project-scoped.
      - name: Remove stray app-net network from a previous run
        run: docker network rm app-net || true

      - name: Docker compose up (secondary containers)
        run: docker compose --env-file stack.env --project-name "$COMPOSE_PROJECT_NAME" --profile=cicd up -d

      - name: Docker compose build (rails)
        run: docker compose --env-file stack.env --project-name "$COMPOSE_PROJECT_NAME" build rails --build-arg RAILS_ENV=${RAILS_ENV}

      - name: Run specs
        run: >-
          docker compose --env-file stack.env --project-name "$COMPOSE_PROJECT_NAME"
          run --rm --name "${APP_NAME}_rails_${{ github.run_id }}" --entrypoint=./docker-entrypoint.test.sh
          --env RAILS_ENV --env ADMIN_USERNAME --env ADMIN_PASSWORD --env DEVISE_JWT_SECRET_KEY
          --env APP_ROOT=$(pwd) rails

      # `.:/var/www/<app>` is a bind mount, so the specs already wrote the report into the runner workspace and the
      # entrypoint rewrote its paths for Sonar.
      - name: Verify coverage report
        run: test -s ./coverage/coverage.json

      # Java 17 is the sonar-scanner requirement as of 5.x
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup SonarQubeRunner
        uses: warchant/setup-sonar-scanner@v8

      - name: Analyze with SonarQube
        run: sonar-scanner
          -Dsonar.host.url=${{ secrets.SONAR_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.projectKey=${{ github.event.repository.name }}
          -Dsonar.scm.provider=git
          -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}
          -Dsonar.ruby.coverage.reportPaths=./coverage/coverage.json
          -Dsonar.coverage.exclusions=app/policies/**,app/helpers/**,app/javascript/**,app/channels/**,app/serializers/**,app/mailers/**,app/jobs/**,app/services/search/**,app/controllers/concerns/**,app/controllers/api_controller.rb,app/controllers/apidocs_controller.rb,app/controllers/application_controller.rb,test/**,spec/**,infrastructure/**,app/controllers/development_pages_controller.rb,app/controllers/api/v1/direct_uploads_controller.rb,data/**,db/migrate/**

      - name: Docker compose down
        if: ${{ always() }}
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --rmi local

      - name: Docker kill remaining containers
        if: ${{ always() }}
        run: |
          containers=$(docker ps -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")
          if [ -n "$containers" ]; then
            docker kill $containers
          fi

      - name: Remove dangling container
        if: ${{ always() }}
        run: |
          container=$(docker ps -a -q --filter "name=${APP_NAME}_rails_${{ github.run_id }}")
          if [ -n "$container" ]; then
            docker rm -f $container --volumes
          fi
